# Authored standard TOML profile fixture.
[meta]
name = "Native profile fixture"

[anchor]
latin_family = "TeX Gyre Pagella"
han_family = "Songti SC"
line_spacing = 1.7
latin_scale = 0.97
han_baseline = 0.04
heading_han_baseline = 0.06

[profile]
base_size = 18
code_capsule = true
code_capsule_pad = 0.3
table_style = "grid"
para_separation = "indent"
para_space_after = 0.5

[future-layout]
# Unknown tables remain opaque to typography.
para_space_after = 0.5
