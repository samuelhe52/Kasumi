<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B18"/><stop offset="0.6" stop-color="#141B36"/><stop offset="1" stop-color="#2C2C4E"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC992"/>
      <stop offset="0.7" stop-color="#F58D58"/>
      <stop offset="1" stop-color="#DC5A36"/>
    </radialGradient>
    <!-- lower limb sinks into the haze, as a low sun does -->
    <linearGradient id="sink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#5A5F86" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A5F86" stop-opacity="0.24"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="640" cy="404" r="146"/></clipPath>
    <!-- fine paper grain, neutral grey so it only shifts value -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#E86A40" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#E86A40" stop-opacity="0.140"/>
      <stop offset="1" stop-color="#E86A40" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE1F2"/><stop offset="1" stop-color="#A9B1CF"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5F86" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A5F86" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="640" cy="404" r="380" fill="url(#glow)"/>
  <circle cx="640" cy="404" r="146" fill="url(#sun)"/>
  <g clip-path="url(#disc)">
    <rect x="494" y="258" width="292" height="292" filter="url(#grain)" opacity="0.12" style="mix-blend-mode:overlay"/>
    <rect x="494" y="258" width="292" height="292" fill="url(#sink)"/>
  </g>
  <rect y="563" width="1024" height="461" fill="url(#fog)"/>
  <rect x="160" y="450" width="560" height="108" rx="54.0" fill="#000000" opacity="0.35" filter="url(#soft)"/><rect x="160" y="440" width="560" height="108" rx="54.0" fill="url(#band)" opacity="0.92"/><rect x="288" y="610" width="576" height="64" rx="32.0" fill="#000000" opacity="0.35" filter="url(#soft)"/><rect x="288" y="600" width="576" height="64" rx="32.0" fill="url(#band)" opacity="0.86"/><rect x="160" y="712" width="640" height="64" rx="32.0" fill="#000000" opacity="0.35" filter="url(#soft)"/><rect x="160" y="702" width="640" height="64" rx="32.0" fill="url(#band)" opacity="0.8"/><rect x="160" y="814" width="404" height="64" rx="32.0" fill="#000000" opacity="0.35" filter="url(#soft)"/><rect x="160" y="804" width="404" height="64" rx="32.0" fill="url(#band)" opacity="0.74"/>
</svg>
